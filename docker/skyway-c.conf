# Skyway C 端外部 HTTPS（部署在宿主机 Nginx）
# 作用：外部 443 -> 本机 Docker 暴露端口 8082
# 使用前请替换：
# 1) server_name 为你的 C 端域名
# 2) ssl_certificate / ssl_certificate_key 为你的证书路径

server {
    listen 80;
    server_name c.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name c.example.com;

    ssl_certificate     /etc/nginx/ssl/c.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/c.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 500M;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket（通常 C 端不一定用到，保留无害）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
