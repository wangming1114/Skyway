# Skyway：管理端与 C 端分别用不同端口，不用路径区分
# 管理端：IP:8081   C 端：IP:8082（端口可在 .env 中改 EXPOSE_NGINX_PORT / EXPOSE_NGINX_C_PORT）
# SSL 在宿主机配置，容器内仅 HTTP

# ---------- 管理端（端口 8081）----------
server {
    listen 8081 default_server;
    server_name _;

    client_max_body_size 500M;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        root /usr/share/nginx/admin;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
    }

    location /prod-api/ {
        proxy_pass http://skyway-admin:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # WebSocket（SSH 终端等）必须的升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---------- C 端（端口 8082）----------
server {
    listen 8082;
    server_name _;

    client_max_body_size 500M;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location / {
        root /usr/share/nginx/c;
        try_files $uri $uri/ /index.html;
        index index.html index.htm;
    }

    location /c-api/ {
        proxy_pass http://skyway-admin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
