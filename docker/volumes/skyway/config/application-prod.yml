# Skyway 生产环境配置（Docker 外挂）
# 使用方式：复制为 application-prod.yml 并按实际环境修改
# 容器启动参数已包含: --spring.config.additional-location=file:/app/config/

server:
  port: 8080

skyway:
  profile: /app/upload

spring:
  mail:
    host: smtp.qq.com
    port: 465
    username: 1942152752@qq.com
    password: ibqzghpihpqibgch
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  redis:
    host: redis
    port: 6379
    password: ${REDIS_PASSWORD:J98%FHF#9h@e88h9fre9}
    database: 0
    timeout: 10s
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-skyway}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
        username: ${MYSQL_USER:-skyway}
        password: ${MYSQL_PASSWORD:o5KjnPYxswsiURZHCPwd}
      slave:
        enabled: false
        url:
        username:
        password:
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username: skyway
        login-password: 123456
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
